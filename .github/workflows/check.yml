name: Test and build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Baseline is up to date
        run: |
          npm run baseline
          git diff --exit-code -- public/data/baseline.json public/data/catalog.json || {
            echo "::error::평가 모델이 바뀌었는데 기준 분포가 갱신되지 않았습니다. npm run baseline 후 커밋하세요."
            exit 1
          }
      - name: Example drawings are up to date
        run: |
          npm run drawings
          git diff --exit-code -- public/drawings public/data/examples.json || {
            echo "::error::예시 도면이 라벨과 다릅니다. npm run drawings 후 커밋하세요."
            exit 1
          }
      # 검증 결과(evidence/results)는 AI 허브 전체 7,275장이 있어야 다시 만들 수 있어(저장소에 없음) CI에서 재현하지 않는다.
      # 데이터가 있는 PC에서 `npm run results` 후 커밋한다. 샘플 20장으로 스크립트가 돌아가는지만 확인한다.
      - name: Validation scripts run (sample mode)
        run: |
          node scripts/validate.mjs --sample > /dev/null
          node scripts/sensitivity.mjs --sample --runs 20 --boot 5 > /dev/null
          git checkout -- evidence/results
      - run: npx astro build
      - run: npm run deploy -- --dry-run
      - name: Score table
        run: npm run evaluate >> "$GITHUB_STEP_SUMMARY"
